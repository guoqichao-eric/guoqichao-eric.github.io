<!-- Hero -->
<section class="pt-28 pb-14 bg-[#f5f6f8]">
  <div class="max-w-6xl mx-auto px-6 text-center">
    <h1 class="font-serif text-4xl md:text-5xl font-bold text-primary mb-2">思考框架</h1>
    <p class="font-display text-xl text-gray-500 italic mb-4">Thinking Framework · 框架库</p>
    <p class="text-gray-600 max-w-3xl mx-auto mb-6">以问题为中心的思考框架与方法论库，覆盖项目管理、写作表达、需求管理、知识管理、决策、问题解决等领域。</p>
    <div id="hero-stats" class="flex flex-wrap justify-center gap-3 text-sm"></div>
  </div>
</section>

<!-- 框架库 -->
<section id="library" class="py-14 bg-white">
  <div class="max-w-6xl mx-auto px-6 flex flex-col items-center">
    <input id="search" type="text" placeholder="搜索框架、关键词、场景…" class="w-full max-w-md text-sm rounded-lg border border-gray-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-accent/40 bg-white mb-4">
    <div id="cat-chips" class="flex flex-wrap justify-center gap-2 mb-4"></div>
    <p id="result-count" class="text-xs text-gray-400 mb-4"></p>
    <div id="frame-grid" class="w-full"></div>
  </div>
</section>

<!-- 思考沉淀 -->
<section id="reflection" class="py-14 bg-surface">
  <div class="max-w-6xl mx-auto px-6">
    <h2 class="font-serif text-3xl font-bold text-primary mb-2 text-center">思考沉淀</h2>
    <p class="text-gray-500 text-center mb-10">Thinking Notes · 思考管理工具与提问沉淀</p>
    <div id="thinking-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-5 max-w-5xl mx-auto"></div>
  </div>
</section>

<!-- Footer -->
<footer class="py-8 bg-[#2c2c2e] text-gray-400 text-center text-sm">
  <p>&copy; 2026 Homepage | SDCIT · Ericsson</p>
  <p class="mt-2"><a href="admin.html" class="text-gray-600 hover:text-gray-300 text-xs transition-colors">后台管理</a></p>
</footer>

<script>
const D = window.SITE_DATA || {};
const FRAMES = window.THINKING_FRAMES || [];
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function parseJsonStr(v) {
  if (!v) return null;
  if (typeof v === 'object') return v;
  try { return JSON.parse(v); } catch (e) { return null; }
}

// Hero 统计
const cats = [];
FRAMES.forEach(function (f) { if (cats.indexOf(f.category) < 0) cats.push(f.category); });
document.getElementById('hero-stats').innerHTML = [
  '<span class="px-4 py-1.5 bg-white rounded-full border border-gray-200 font-medium text-gray-700">' + FRAMES.length + ' 个框架</span>',
  '<span class="px-4 py-1.5 bg-white rounded-full border border-gray-200 font-medium text-gray-700">' + cats.length + ' 个领域</span>'
].join('');

// 分类筛选 chips
let activeCat = 'ALL';
let searchText = '';
const chipBox = document.getElementById('cat-chips');
function renderChips() {
  const all = ['ALL'].concat(cats);
  chipBox.innerHTML = all.map(function (c) {
    const n = c === 'ALL' ? FRAMES.length : FRAMES.filter(function (f) { return f.category === c; }).length;
    return '<button onclick="setCat(\'' + c + '\')" class="px-3 py-1.5 rounded-full text-xs font-medium border transition-colors ' +
      (c === activeCat ? 'bg-primary text-white border-primary' : 'bg-white text-gray-600 border-gray-200 hover:border-accent/50') + '">' + esc(c) + ' · ' + n + '</button>';
  }).join('');
}
function setCat(c) { activeCat = c; renderChips(); renderGrid(); }

document.getElementById('search').addEventListener('input', function (e) {
  searchText = e.target.value.trim().toLowerCase();
  renderGrid();
});

// 卡片渲染
function stepsHtml(f) {
  const steps = parseJsonStr(f.steps);
  if (!Array.isArray(steps) || !steps.length) return '';
  return '<div class="mt-3"><p class="text-xs font-semibold text-gray-700 mb-1">步骤</p><ol class="list-decimal ml-4 space-y-0.5 text-xs text-gray-500">' +
    steps.map(function (s) { return '<li>' + esc(s.name || '') + '</li>'; }).join('') + '</ol></div>';
}
function ittoHtml(f) {
  const it = parseJsonStr(f.itto);
  if (!it) return '';
  let h = '<div class="mt-3 grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">';
  h += '<div><p class="font-semibold text-gray-700 mb-1">输入</p><p class="text-gray-500">' + esc((it.inputs || []).join('、')) + '</p></div>';
  h += '<div><p class="font-semibold text-gray-700 mb-1">工具</p><p class="text-gray-500">' + esc((it.tools || []).join('、')) + '</p></div>';
  h += '<div><p class="font-semibold text-gray-700 mb-1">输出</p><p class="text-gray-500">' + esc((it.outputs || []).join('、')) + '</p></div>';
  return h + '</div>';
}
function cardBody(f) {
  let h = '';
  h += '<div class="mt-3"><p class="text-xs font-semibold text-gray-700 mb-1">解决什么问题</p><p class="text-xs text-gray-500 leading-relaxed">' + esc(f.problem_statement || f.summary || '') + '</p></div>';
  h += '<div class="mt-3"><p class="text-xs font-semibold text-gray-700 mb-1">适用场景</p><p class="text-xs text-gray-500 leading-relaxed">' + esc(f.scene || '') + '</p></div>';
  if (f.core_logic) h += '<div class="mt-3"><p class="text-xs font-semibold text-gray-700 mb-1">核心逻辑</p><p class="text-xs text-gray-500 leading-relaxed">' + esc(f.core_logic) + '</p></div>';
  h += stepsHtml(f);
  h += ittoHtml(f);
  if (f.applicable) h += '<div class="mt-3"><p class="text-xs font-semibold text-gray-700 mb-1">适用</p><p class="text-xs text-gray-500">' + esc(f.applicable) + '</p></div>';
  if (f.not_applicable) h += '<div class="mt-3"><p class="text-xs font-semibold text-gray-700 mb-1">不适用</p><p class="text-xs text-gray-500">' + esc(f.not_applicable) + '</p></div>';
  if (f.cases) h += '<div class="mt-3"><p class="text-xs font-semibold text-gray-700 mb-1">实践案例</p><p class="text-xs text-gray-500 leading-relaxed">' + esc(f.cases) + '</p></div>';
  if (f.limitations) h += '<div class="mt-3"><p class="text-xs font-semibold text-gray-700 mb-1">局限</p><p class="text-xs text-gray-500 leading-relaxed">' + esc(f.limitations) + '</p></div>';
  if (f.templates) h += '<div class="mt-3"><p class="text-xs font-semibold text-gray-700 mb-1">模板</p><p class="text-xs text-gray-500">' + esc(f.templates) + '</p></div>';
  return h;
}
function renderGrid() {
  const grid = document.getElementById('frame-grid');
  let list = FRAMES;
  if (activeCat !== 'ALL') list = list.filter(function (f) { return f.category === activeCat; });
  if (searchText) {
    list = list.filter(function (f) {
      const hay = [f.name, f.aliases, f.keywords, f.problem_statement, f.scene, f.category].join(' ').toLowerCase();
      return hay.indexOf(searchText) >= 0;
    });
  }
  document.getElementById('result-count').textContent = '共 ' + list.length + ' 个框架';
  // ALL 模式：网格整齐排列名称（点击名称跳到对应分类查看详情）
  if (activeCat === 'ALL' && !searchText) {
    grid.innerHTML = '<div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5">' + list.map(function (f) {
      return '<button onclick="setCat(\'' + esc(f.category) + '\')" class="text-center px-3 py-2.5 bg-surface rounded-xl border border-gray-100 text-sm text-gray-700 hover:border-accent/40 hover:text-accent transition-colors">' + esc(f.name) + '</button>';
    }).join('') + '</div>';
    return;
  }
  // 分类 / 搜索模式：卡片（可展开详情）
  grid.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 gap-5">' + list.map(function (f, i) {
    return '<div class="bg-surface rounded-xl border border-gray-100 p-5 hover:border-accent/30 transition-colors">'
      + '<div class="flex items-start justify-between gap-3 mb-2">'
      + '<h3 class="font-bold text-gray-800">' + esc(f.name) + '</h3>'
      + '<span class="text-[10px] text-gray-400 font-mono shrink-0 mt-1">' + esc(f.code || '') + '</span></div>'
      + '<div class="flex items-center gap-2 mb-3">'
      + '<span class="px-2 py-0.5 bg-accent/10 text-accent text-[11px] rounded font-medium">' + esc(f.category || '') + '</span>'
      + '<span class="text-[11px] text-gray-400">' + esc(f.mastery_level || '') + '</span></div>'
      + '<p class="text-sm text-gray-500 leading-relaxed line-clamp-3" id="preview-' + i + '">' + esc(f.problem_statement || f.summary || '') + '</p>'
      + '<div class="hidden mt-2" id="body-' + i + '">' + cardBody(f) + '</div>'
      + '<button onclick="toggleCard(' + i + ')" class="mt-3 text-xs text-accent hover:text-accent/80 font-medium">'
      + '<span id="btn-txt-' + i + '">展开详情</span> <i data-lucide="chevron-down" class="w-3.5 h-3.5 inline-block" id="btn-ico-' + i + '"></i></button>'
      + '</div>';
  }).join('') + '</div>';
  if (window.lucide) lucide.createIcons();
}
function toggleCard(i) {
  const body = document.getElementById('body-' + i);
  const btn = document.getElementById('btn-txt-' + i);
  const ico = document.getElementById('btn-ico-' + i);
  const preview = document.getElementById('preview-' + i);
  const open = body.classList.contains('hidden');
  body.classList.toggle('hidden');
  preview.classList.toggle('line-clamp-3', !open);
  btn.textContent = open ? '收起' : '展开详情';
  ico.setAttribute('data-lucide', open ? 'chevron-up' : 'chevron-down');
  if (window.lucide) lucide.createIcons();
}

// 思考沉淀（data.js thinking）
const D2 = D.thinking || [];
document.getElementById('thinking-grid').innerHTML = D2.map(function (x) {
  return '<div class="bg-white rounded-xl p-5 border border-gray-100 text-center hover:shadow-md hover:shadow-gray-200/60 transition-all duration-300">'
    + '<div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-3">'
    + '<i data-lucide="' + esc(x.icon) + '" class="w-6 h-6 text-primary"></i></div>'
    + '<h4 class="font-bold text-gray-800 text-sm mb-1">' + esc(x.title) + '</h4>'
    + '<p class="text-xs text-gray-500 leading-relaxed">' + esc(x.desc) + '</p></div>';
}).join('');

renderChips();
renderGrid();
if (window.lucide) lucide.createIcons();
</script>
</body>
